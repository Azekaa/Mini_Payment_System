spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/migration/changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379
    cache:
      type: redis

app:
  cache:
    payments-ttl: 30s


