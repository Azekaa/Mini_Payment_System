spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/migration/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
app:
  cache:
    payments-ttl: 30s